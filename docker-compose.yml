services:
  sentinel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STAFF_AUTH_USER=${STAFF_AUTH_USER:-warden}
      - STAFF_AUTH_PASS=${STAFF_AUTH_PASS}
      - STAFF_SESSION_SECRET=${STAFF_SESSION_SECRET}
      - ADMIN_BOOTSTRAP_USER=${ADMIN_BOOTSTRAP_USER:-rakicko}
      - ADMIN_BOOTSTRAP_PASS=${ADMIN_BOOTSTRAP_PASS}
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
