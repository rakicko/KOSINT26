<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kosintGrad1" x1="2" y1="18" x2="34" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="kosintCoreGrad" x1="12" y1="12" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="kosintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Geospatial Observation Eye -->
  <path d="M3 18C7.5 10.5 13.5 6.5 18 6.5C22.5 6.5 28.5 10.5 33 18C28.5 25.5 22.5 29.5 18 29.5C13.5 29.5 7.5 25.5 3 18Z" 
        stroke="url(#kosintGrad1)" stroke-width="1.8" stroke-linejoin="round" opacity="0.95"/>
  
  <!-- Topographic Contour / Radar Rings -->
  <ellipse cx="18" cy="18" rx="10" ry="8.5" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2.5 1.5" opacity="0.5"/>
  <ellipse cx="18" cy="18" rx="6.5" ry="6.5" stroke="url(#kosintGrad1)" stroke-width="1.4" opacity="0.85"/>
  
  <!-- Network Coordinate Lines (Intelligence Grid) -->
  <line x1="18" y1="4" x2="18" y2="9" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="18" y1="27" x2="18" y2="32" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="1" y1="18" x2="6" y2="18" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="30" y1="18" x2="35" y2="18" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Central Glowing Sensor Core / Focal Point -->
  <circle cx="18" cy="18" r="3" fill="url(#kosintCoreGrad)" filter="url(#kosintGlow)"/>
  <circle cx="18" cy="18" r="1" fill="#ffffff"/>
</svg>
